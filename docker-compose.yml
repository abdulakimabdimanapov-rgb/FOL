# ============================================
# FOL — Docker Compose
# Run all services with one command:
#   docker compose up -d
# ============================================

services:
  # ─── Orchestrator (main AI server) ───
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: fol-orchestrator
    command: python3 orchestrator/server.py
    ports:
      - "8420:8420"
    volumes:
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=8420
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8420/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Agent Server (desktop/browser control) ───
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: fol-agent
    command: python3 agent-server/server.py
    ports:
      - "8421:8421"
    volumes:
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=8421
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8421/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── FOL API (JARVIS commands) ───
  fol-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: fol-api
    command: python3 fol/main.py
    ports:
      - "8754:8754"
    volumes:
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=8754
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8754/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Web UI (Next.js, optional) ───
