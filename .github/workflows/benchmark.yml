name: Test Speed Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual trigger

env:
  PYTHON_VERSION: "3.11.11"
  BENCH_HISTORY_BRANCH: "benchmark-history"

jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-xdist

      - name: Run benchmarks
        id: bench
        run: |
          bash scripts/run_benchmarks.sh 2>&1 | tee benchmark/output.txt

      - name: Compare with previous benchmark
        id: compare
        run: |
          # Fetch historical results from benchmark-history branch
          git fetch origin $BENCH_HISTORY_BRANCH 2>/dev/null || {
            echo "No previous benchmark data found — this is the first run."
            echo "is_first=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Save historical results.jsonl to temp BEFORE overwriting with current data
          git checkout origin/$BENCH_HISTORY_BRANCH -- benchmark/results.jsonl 2>/dev/null || {
            echo "No previous results.jsonl found."
            echo "is_first=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          cp benchmark/results.jsonl /tmp/prev_results.jsonl

          # Restore current branch's version (our fresh results)
          git checkout HEAD -- benchmark/results.jsonl 2>/dev/null || true

          echo "is_first=false" >> "$GITHUB_OUTPUT"

          # Run comparison script against saved historical data
          python3 scripts/compare_benchmarks.py \
            --previous /tmp/prev_results.jsonl \
            --current benchmark/output.txt \
            --threshold 0.15

      - name: Upload benchmark history
        if: github.ref == 'refs/heads/main'
        run: |
          # Checkout or create benchmark-history branch
          git fetch origin $BENCH_HISTORY_BRANCH 2>/dev/null && \
            git checkout $BENCH_HISTORY_BRANCH || \
            git checkout --orphan $BENCH_HISTORY_BRANCH

          # Copy new results from the original commit
          git checkout "${{ github.sha }}" -- benchmark/results.jsonl
          git config user.name "benchmark-bot"
          git config user.email "benchmark-bot@secondself.local"
          git add benchmark/results.jsonl
          git commit -m "Benchmark: ${{ github.sha }} @ $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin $BENCH_HISTORY_BRANCH

      - name: PR Comment — Benchmark Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('benchmark/output.txt', 'utf8');

            // Parse all JSON results from output
            const lines = output.split('\n').filter(l => l.startsWith('{'));
            let table = '| Test Group | Tests | Execution (s) | Wall (s) | Peak Mem (KB) |\n';
            table += '|---|---|---|---|---|\n';

            // Build table from current run
            for (const line of lines) {
              try {
                const r = JSON.parse(line);
                const label = r.label || 'unknown';
                table += `| ${label} | ${r.tests_passed || '-'} | ${r.execution_seconds || '-'}s | ${r.wall_seconds || '-'}s | ${r.peak_mem_kb || '-'} |\n`;
              } catch {}
            }

            const body = `## ⏱ Test Speed Benchmark\n\n${table}\n\n[View full history](https://github.com/${{ github.repository }}/tree/benchmark-history/benchmark)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
