<svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="460" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body-grad" x1="412" y1="350" x2="612" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#7c5cff" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg-grad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="200" y1="0" x2="200" y2="1024" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="1024" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="1024" stroke="white" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="1024" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1024" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="400" x2="1024" y2="400" stroke="white" stroke-width="1"/>
    <line x1="0" y1="600" x2="1024" y2="600" stroke="white" stroke-width="1"/>
    <line x1="0" y1="800" x2="1024" y2="800" stroke="white" stroke-width="1"/>
  </g>

  <!-- Avatar body glow -->
  <ellipse cx="512" cy="520" rx="200" ry="210" fill="#7c5cff" filter="url(#inner-glow)" opacity="0.2"/>

  <!-- Avatar body -->
  <ellipse cx="512" cy="520" rx="160" ry="175" fill="url(#body-grad)" filter="url(#shadow)"/>

  <!-- Body highlight -->
  <ellipse cx="512" cy="480" rx="120" ry="100" fill="white" opacity="0.08"/>

  <!-- Left cheek -->
  <ellipse cx="430" cy="540" rx="35" ry="20" fill="#f87171" opacity="0.25"/>

  <!-- Right cheek -->
  <ellipse cx="594" cy="540" rx="35" ry="20" fill="#f87171" opacity="0.25"/>

  <!-- Left eye -->
  <ellipse cx="470" cy="500" rx="22" ry="26" fill="#0a0a1a"/>
  <!-- Left eye shine -->
  <circle cx="478" cy="492" r="8" fill="white" opacity="0.85"/>

  <!-- Right eye -->
  <ellipse cx="554" cy="500" rx="22" ry="26" fill="#0a0a1a"/>
  <!-- Right eye shine -->
  <circle cx="562" cy="492" r="8" fill="white" opacity="0.85"/>

  <!-- Smile -->
  <path d="M470 565 Q512 600 554 565" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Antenna -->
  <line x1="512" y1="345" x2="512" y2="310" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <circle cx="512" cy="300" r="12" fill="#a78bfa" opacity="0.7"/>

  <!-- Antenna glow -->
  <circle cx="512" cy="300" r="20" fill="#a78bfa" opacity="0.2"/>

  <!-- FOL text -->
  <text x="512" y="820" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="96" font-weight="700" fill="white" opacity="0.9" letter-spacing="12">FOL</text>

  <!-- Subtle "second self" text -->
  <text x="512" y="880" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-size="32" font-weight="400" fill="white" opacity="0.35" letter-spacing="4">second self</text>
</svg>
