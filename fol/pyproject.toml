[project]
name = "fol"
version = "0.1.0"
description = "F.O.L. — Personal AI Assistant (JARVIS-style)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "FOL Project" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "mlx>=0.19.0",
    "mlx-lm>=0.19.0",
    "mlx-whisper>=0.4.0",
    "chromadb>=0.5.5",
    "structlog>=24.4.0",
    "pyobjc>=10.3.0",
    "py-applescript>=2.0.0",
    "pluggy>=1.5.0",
    "websockets>=13.0",
    "pyzmq>=26.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
fol = "core.app:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short --cov=core --cov=modules --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["core", "modules"]
branch = true
omit = ["*/tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
